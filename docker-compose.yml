services:
  dramabox:
    build: .
    restart: unless-stopped
    ports:
      # HOST_PORT is the port on your PC or VPS. 8096 inside the container stays fixed.
      - "${HOST_PORT:-8096}:8096"
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-./media}:/media
    environment:
      - DRAMABOX_PROXY=${DRAMABOX_PROXY:-}
      - REQUEST_DELAY=${REQUEST_DELAY:-}
      - DRAMABOX_LANG=${DRAMABOX_LANG:-}
      - TZ=${TZ:-UTC}
      # Address phones, TVs and the Android app should open.
      # LAN example:  http://192.168.1.111:8096
      # Public example after port forwarding: http://YOUR_PUBLIC_IP:8096
      - PUBLIC_URL=${PUBLIC_URL:-}
    # mDNS needs multicast, which Docker bridge networking does not forward.
    # On a Linux host you can use `network_mode: host` instead of `ports`
    # (remove the ports mapping; host networking uses 8096 directly).
    # Not supported on Docker Desktop.
    # network_mode: host
